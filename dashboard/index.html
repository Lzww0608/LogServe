<!doctype html>
<!-- Static dashboard for locally viewing a LogServe snapshot.json export. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogServe Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #1d2633;
      --muted: #697586;
      --line: #d8dee8;
      --accent: #0f766e;
      --warn: #b45309;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 18px 24px;
      background: #111827;
      color: white;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-bottom: 10px; }
    main {
      padding: 20px 24px 32px;
      display: grid;
      gap: 18px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .metric {
      background: #eef6f5;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 6px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .metric strong { font-size: 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; background: #f8fafc; }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      background: #e5e7eb;
    }
    .ok { background: #dcfce7; color: #166534; }
    .warn { background: #fef3c7; color: var(--warn); }
    .bad { background: #fee2e2; color: var(--bad); }
    .dag {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }
    .node {
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 6px;
      padding: 7px 10px;
    }
    .arrow { color: var(--muted); }
    code { color: #374151; }
  </style>
</head>
<body>
  <header>
    <h1>LogServe Dashboard</h1>
    <div id="updated">snapshot.json</div>
  </header>
  <main>
    <section class="metrics" id="metrics"></section>
    <section>
      <h2>Workflow DAG</h2>
      <div id="workflows"></div>
    </section>
    <section>
      <h2>Tasks</h2>
      <div id="tasks"></div>
    </section>
    <section>
      <h2>Actors</h2>
      <div id="actors"></div>
    </section>
    <section>
      <h2>Workers And Model Cache</h2>
      <div id="workers"></div>
    </section>
  </main>
  <script>
    // statusClass maps protobuf-style status strings onto compact badge colors.
    // Unknown or in-progress statuses intentionally use the warning style.
    const statusClass = (value) => {
      if (String(value).includes("SUCCEEDED") || String(value).includes("COMPLETED") || String(value).includes("ACTIVE")) return "ok";
      if (String(value).includes("FAILED")) return "bad";
      return "warn";
    };

    // pick tolerates both camelCase protobuf JSON and snake_case snapshots so the
    // same page can read outputs produced by different serializers.
    const pick = (obj, camel, snake) => obj?.[camel] ?? obj?.[snake];
    // cell normalizes missing optional fields to a visible placeholder instead of
    // leaving table cells blank or rendering JavaScript null/undefined strings.
    const cell = (value) => value === undefined || value === null || value === "" ? "-" : value;

    // table renders small local snapshot tables. Values are inserted as HTML, so
    // this page should be used with LogServe-generated snapshot files, not
    // arbitrary untrusted JSON.
    const table = (columns, rows) => {
      const head = `<tr>${columns.map((c) => `<th>${c.label}</th>`).join("")}</tr>`;
      const body = rows.map((row) => `<tr>${columns.map((c) => `<td>${c.render ? c.render(row) : cell(row[c.key])}</td>`).join("")}</tr>`).join("");
      return `<table>${head}${body}</table>`;
    };

    // status keeps badge markup centralized so workflow, task, and actor tables
    // classify statuses consistently.
    const status = (value) => `<span class="status ${statusClass(value)}">${cell(value)}</span>`;

    // render materializes the entire snapshot into static DOM sections. It does
    // not retain client-side state; each load reflects the fetched snapshot only.
    const render = (data) => {
      // Metadata materializer fields are optional because older snapshots do not
      // include eventual-consistency diagnostics.
      const materializer = pick(data, "metadataMaterializer", "metadata_materializer") || {};
      const materializerMode = pick(materializer, "mode", "mode");
      const metricRows = [
        ["Queue Depth", pick(data, "queueDepth", "queue_depth") || 0],
        ["High Watermark", pick(data, "queueHighWatermark", "queue_high_watermark") || 0],
        ["Redelivery Timeout", `${pick(data, "redeliveryTimeoutMs", "redelivery_timeout_ms") || 0} ms`],
        ["Last Log Append", `${pick(data, "lastLogAppendMs", "last_log_append_ms") || 0} ms`],
        ["Log Slow Limit", `${pick(data, "logAppendSlowMs", "log_append_slow_ms") || 0} ms`],
        ["Compactable Records", pick(data, "compactableLogRecords", "compactable_log_records") || 0],
        ["Compactable Bytes", pick(data, "compactableLogBytes", "compactable_log_bytes") || 0],
        ["Scheduling Policy", pick(data, "schedulingPolicy", "scheduling_policy") || "-"],
      ];
      if (materializerMode) {
        metricRows.push(
          ["Metadata Mode", materializerMode],
          ["Metadata Pending", pick(materializer, "pendingDeltas", "pending_deltas") || 0],
          ["Metadata Lag", `${pick(materializer, "eventualLagEstimateMs", "eventual_lag_estimate_ms") || 0} ms`],
          ["Metadata Flush Errors", pick(materializer, "flushErrorCount", "flush_error_count") || 0],
        );
      }
      // Metric rows are generated from a flat list so optional metadata metrics can
      // be appended without duplicating card markup.
      document.getElementById("metrics").innerHTML = metricRows.map(([label, value]) => `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join("");

      // Workflow DAG rendering is intentionally linear: integration snapshots use
      // ordered steps, while dependency detail stays in the JSON payload.
      document.getElementById("workflows").innerHTML = (data.workflows || []).map((wf) => {
        // Each step callback emits one node and inserts arrows only between nodes,
        // avoiding a leading arrow for the first step.
        const nodes = (wf.steps || []).map((step, i) => `${i ? '<span class="arrow">-></span>' : ''}<span class="node">${pick(step, "stepId", "step_id")}<br>${status(step.status)}</span>`).join("");
        return `<p><code>${pick(wf, "workflowId", "workflow_id")}</code> ${status(wf.status)}</p><div class="dag">${nodes}</div>`;
      }).join("") || "No workflows";

      // Table column renderers hide protobuf field-name differences behind pick so
      // dashboard snapshots can be compared across Go and JSON conventions.
      document.getElementById("tasks").innerHTML = table([
        { label: "Task", render: (r) => pick(r, "taskId", "task_id") },
        { label: "Name", render: (r) => pick(r, "taskName", "task_name") },
        { label: "Status", render: (r) => status(r.status) },
        { label: "Worker", render: (r) => pick(r, "workerId", "worker_id") },
        { label: "Workflow", render: (r) => pick(r, "workflowId", "workflow_id") },
        { label: "Actor", render: (r) => pick(r, "actorId", "actor_id") },
        { label: "Model", render: (r) => [pick(r, "llmModelName", "llm_model_name"), pick(r, "llmModelVersion", "llm_model_version")].filter(Boolean).join(":") || "-" },
      ], data.tasks || []);

      // Actor rows expose both ownership and snapshot progress because recovery
      // tests depend on those fields moving independently.
      document.getElementById("actors").innerHTML = table([
        { label: "Actor", render: (r) => pick(r, "actorId", "actor_id") },
        { label: "Class", render: (r) => pick(r, "className", "class_name") },
        { label: "Status", render: (r) => status(r.status) },
        { label: "Owner", render: (r) => pick(r, "ownerWorkerId", "owner_worker_id") },
        { label: "Epoch", key: "epoch" },
        { label: "Commands", render: (r) => pick(r, "commandCount", "command_count") },
        { label: "Snapshot", render: (r) => pick(r, "snapshotCommandCount", "snapshot_command_count") },
      ], data.actors || []);

      // Worker rows flatten cached model entries into name:version labels for quick
      // scheduler-locality inspection.
      document.getElementById("workers").innerHTML = table([
        { label: "Worker", render: (r) => pick(r, "workerId", "worker_id") },
        { label: "Capacity", key: "capacity" },
        { label: "Running", render: (r) => pick(r, "runningTasks", "running_tasks") },
        { label: "Cached Models", render: (r) => (pick(r, "cachedModels", "cached_models") || []).map((m) => `${m.name}:${m.version || "v1"}`).join(", ") || "-" },
        { label: "Heartbeat", render: (r) => pick(r, "lastHeartbeatMs", "last_heartbeat_ms") },
      ], data.workers || []);
    };

    // Disable browser caching so refreshing the static page picks up a newly
    // exported snapshot.json from disk or a simple static server.
    fetch("snapshot.json", { cache: "no-store" })
      // The first promise callback performs only JSON decoding; rendering is kept
      // in render so the snapshot-to-DOM mapping is testable by inspection.
      .then((response) => response.json())
      // render is passed directly because it already accepts the decoded snapshot.
      .then(render)
      // Replace the main content on load failure so missing snapshot.json is visible
      // even when the rest of the static shell loaded correctly.
      .catch((error) => {
        document.querySelector("main").innerHTML = `<section>Unable to load snapshot.json: ${error.message}</section>`;
      });
  </script>
</body>
</html>
