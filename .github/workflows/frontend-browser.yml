name: Frontend Browser Tests

# Run the browser-facing console gates on main updates and every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        # All npm scripts, generated test directories, and Playwright config live under web/.
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match the local frontend toolchain used by Vite 7 and Playwright tests.
          node-version: 22
          cache: npm
          # Scope the cache key to the frontend lockfile so backend changes do not churn npm cache state.
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # Chromium plus OS dependencies are required for both Playwright specs and Lighthouse.
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        # Keep browser and Lighthouse jobs as separate steps because the mock API uses a fixed local port.
        run: npm run test:browser

      - name: Lighthouse accessibility
        run: npm run test:lighthouse

      - name: Upload browser artifacts
        # Always upload Playwright traces, screenshots, and Lighthouse reports when they exist.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore