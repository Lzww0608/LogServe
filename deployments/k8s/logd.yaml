apiVersion: apps/v1
kind: Deployment
metadata:
  name: logserve-logd
  namespace: logserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logserve-logd
  template:
    metadata:
      labels:
        app: logserve-logd
    spec:
      containers:
        - name: logd
          image: logserve:local
          imagePullPolicy: IfNotPresent
          args: ["logserve-logd", "--addr", "0.0.0.0:50051", "--data-dir", "/var/lib/logserve/logstore"]
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: logserve-logd
  namespace: logserve
spec:
  selector:
    app: logserve-logd
  ports:
    - port: 50051
      targetPort: 50051
