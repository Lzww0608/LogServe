# logd owns the durable shared log. The pod mounts a PVC at the same data path
# used by the container image and Compose deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logserve-logd
  namespace: logserve
spec:
  # The logstore PVC uses ReadWriteOnce, so this manifest deliberately runs one
  # logd replica instead of relying on multi-writer storage semantics.
  replicas: 1
  selector:
    matchLabels:
      app: logserve-logd
  template:
    metadata:
      labels:
        app: logserve-logd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logd
          image: logserve:local
          imagePullPolicy: IfNotPresent
          # Data-dir points at the PVC mount; changing it would break recovery
          # expectations for restarts against the same logstore volume.
          args: ["logserve-logd", "--addr", "0.0.0.0:50051", "--data-dir", "/var/lib/logserve/logstore"]
          env:
            - name: LOGSERVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logserve-secrets
                  key: api-token
          ports:
            - containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # logstore is the only durable mount; /tmp remains ephemeral for a
            # read-only-rootfs compatible runtime scratch area.
            - name: logstore
              mountPath: /var/lib/logserve/logstore
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logstore
          persistentVolumeClaim:
            claimName: logserve-logstore
        - name: tmp
          emptyDir: {}
---
# ClusterIP exposes the log gRPC port to control/workers without publishing it
# outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: logserve-logd
  namespace: logserve
spec:
  type: ClusterIP
  selector:
    app: logserve-logd
  ports:
    - port: 50051
      targetPort: 50051
---
# The PVC is intentionally small for local kind/dev clusters; production-like
# durability depends on the storage class backing this claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logserve-logstore
  namespace: logserve
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
