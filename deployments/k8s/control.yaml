# Control-plane deployment for the minimal Kubernetes topology. It connects to
# logd through the ClusterIP service and reads the API token from the shared
# logserve-secrets Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logserve-control
  namespace: logserve
spec:
  # A single replica avoids two control planes materializing state from the same
  # prototype log stream without leader election.
  replicas: 1
  selector:
    matchLabels:
      app: logserve-control
  template:
    metadata:
      labels:
        app: logserve-control
    spec:
      # Pod-level ids match the image's logserve user so emptyDir mounts remain
      # writable even while the container root filesystem is read-only.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: logserve:local
          imagePullPolicy: IfNotPresent
          # Args select the control binary from the shared image and point it at
          # the in-cluster logd service rather than a host-bound address.
          args: ["logserve-control", "--addr", "0.0.0.0:50052", "--log-addr", "logserve-logd:50051"]
          env:
            - name: LOGSERVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logserve-secrets
                  key: api-token
          ports:
            - containerPort: 50052
          # TCP probes are sufficient here because the gRPC service binds only
          # after the control server has started listening.
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The process should only write to declared volumes such as /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# ClusterIP keeps control private to the namespace while allowing web/workers to
# resolve the stable logserve-control DNS name.
apiVersion: v1
kind: Service
metadata:
  name: logserve-control
  namespace: logserve
spec:
  type: ClusterIP
  selector:
    app: logserve-control
  ports:
    - port: 50052
      targetPort: 50052
