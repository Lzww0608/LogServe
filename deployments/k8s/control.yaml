apiVersion: apps/v1
kind: Deployment
metadata:
  name: logserve-control
  namespace: logserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logserve-control
  template:
    metadata:
      labels:
        app: logserve-control
    spec:
      containers:
        - name: control
          image: logserve:local
          imagePullPolicy: IfNotPresent
          args: ["logserve-control", "--addr", "0.0.0.0:50052", "--log-addr", "logserve-logd:50051"]
          ports:
            - containerPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: logserve-control
  namespace: logserve
spec:
  selector:
    app: logserve-control
  ports:
    - port: 50052
      targetPort: 50052
