# Default namespace policy for the demo topology: pods may talk to each other
# and resolve DNS, while other ingress/egress is denied by omission.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logserve-internal-only
  namespace: logserve
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow only traffic from pods in the same namespace.
    - from:
        - podSelector: {}
  egress:
    # Internal service calls stay inside the namespace; DNS is the only broader
    # egress required so pods can resolve ClusterIP service names.
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
