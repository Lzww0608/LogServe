apiVersion: apps/v1
kind: Deployment
metadata:
  name: logserve-worker-a
  namespace: logserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logserve-worker-a
  template:
    metadata:
      labels:
        app: logserve-worker-a
        role: logserve-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: logserve:local
          imagePullPolicy: IfNotPresent
          args:
            - logserve-worker
            - --worker-id
            - worker-a
            - --control-addr
            - logserve-control:50052
            - --log-addr
            - logserve-logd:50051
            - --executor
            - /app/executor/python/server.py
            - --models
            - model-A:v1
          env:
            - name: LOGSERVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logserve-secrets
                  key: api-token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
