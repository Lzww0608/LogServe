# Base local Compose topology for the full LogServe stack. Host ports bind to
# 127.0.0.1 so the deployment is reachable from the developer machine without
# exposing service ports on every host interface.
services:
  # PostgreSQL stores control-plane metadata when LOGSERVE_METADATA_STORE=postgres.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${LOGSERVE_POSTGRES_USER:-logserve}
      POSTGRES_PASSWORD: ${LOGSERVE_POSTGRES_PASSWORD:?set LOGSERVE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LOGSERVE_POSTGRES_DB:-logserve}
    ports:
      - "127.0.0.1:${LOGSERVE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  # NATS runs with JetStream enabled for deployments that exercise queue-backed
  # integration paths; read-only rootfs and dropped caps keep it constrained.
  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "127.0.0.1:${LOGSERVE_NATS_PORT:-4222}:4222"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # MinIO is the local S3-compatible result store used by control and workers.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LOGSERVE_S3_ACCESS_KEY:?set LOGSERVE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LOGSERVE_S3_SECRET_KEY:?set LOGSERVE_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${LOGSERVE_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${LOGSERVE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    security_opt:
      - no-new-privileges:true

  # logd owns the append-only shared log; its data directory is the only service
  # state persisted through the logstore-data volume.
  logd:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        GOPROXY: ${LOGSERVE_DOCKER_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${LOGSERVE_DOCKER_GOSUMDB:-sum.golang.org}
    command: ["logserve-logd", "--addr", "0.0.0.0:50051", "--data-dir", "/var/lib/logserve/logstore"]
    environment:
      # Compose expansion fails fast when the shared API token is absent, making
      # accidental unauthenticated local stacks explicit.
      LOGSERVE_API_TOKEN: ${LOGSERVE_API_TOKEN:?set LOGSERVE_API_TOKEN}
    ports:
      - "127.0.0.1:${LOGSERVE_LOGD_PORT:-50051}:50051"
    volumes:
      - logstore-data:/var/lib/logserve/logstore
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0

  # control materializes workflow/task/actor state from logd and persists query
  # metadata to PostgreSQL while writing task results to MinIO.
  control:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        GOPROXY: ${LOGSERVE_DOCKER_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${LOGSERVE_DOCKER_GOSUMDB:-sum.golang.org}
    command: ["logserve-control", "--addr", "0.0.0.0:50052", "--log-addr", "logd:50051"]
    environment:
      LOGSERVE_API_TOKEN: ${LOGSERVE_API_TOKEN:?set LOGSERVE_API_TOKEN}
      LOGSERVE_METADATA_STORE: postgres
      LOGSERVE_POSTGRES_MODE: ${LOGSERVE_POSTGRES_MODE:-sync}
      # The DSN is built from the same Compose environment used to create the
      # postgres container so credentials and database name stay in lockstep.
      LOGSERVE_POSTGRES_DSN: postgres://${LOGSERVE_POSTGRES_USER:-logserve}:${LOGSERVE_POSTGRES_PASSWORD:?set LOGSERVE_POSTGRES_PASSWORD}@postgres:5432/${LOGSERVE_POSTGRES_DB:-logserve}?sslmode=${LOGSERVE_POSTGRES_SSLMODE:-disable}
      LOGSERVE_RESULT_STORE: minio
      LOGSERVE_S3_ENDPOINT: http://minio:9000
      LOGSERVE_S3_BUCKET: ${LOGSERVE_S3_BUCKET:-logserve-results}
      LOGSERVE_S3_ACCESS_KEY: ${LOGSERVE_S3_ACCESS_KEY:?set LOGSERVE_S3_ACCESS_KEY}
      LOGSERVE_S3_SECRET_KEY: ${LOGSERVE_S3_SECRET_KEY:?set LOGSERVE_S3_SECRET_KEY}
      LOGSERVE_S3_REGION: ${LOGSERVE_S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${LOGSERVE_CONTROL_PORT:-50052}:50052"
    depends_on:
      - logd
      - postgres
      - nats
      - minio
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0

  # web serves the console and talks to control/logd over the internal Compose
  # network; only the browser-facing HTTP port is published to localhost.
  web:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.web
      args:
        GOPROXY: ${LOGSERVE_DOCKER_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${LOGSERVE_DOCKER_GOSUMDB:-sum.golang.org}
    command: ["logserve-web", "--addr", "0.0.0.0:8080", "--control-addr", "control:50052", "--log-addr", "logd:50051", "--static-dir", "/app/web/dist"]
    environment:
      LOGSERVE_API_TOKEN: ${LOGSERVE_API_TOKEN:?set LOGSERVE_API_TOKEN}
    ports:
      - "127.0.0.1:${LOGSERVE_WEB_PORT:-8080}:8080"
    depends_on:
      - control
      - logd
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5

  # The default worker handles ordinary Python executor work and shares the same
  # MinIO result-store configuration as the control plane.
  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      args:
        GOPROXY: ${LOGSERVE_DOCKER_GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${LOGSERVE_DOCKER_GOSUMDB:-sum.golang.org}
    command: ["logserve-worker", "--worker-id", "worker-1", "--control-addr", "control:50052", "--log-addr", "logd:50051", "--executor", "/app/executor/python/server.py"]
    environment:
      LOGSERVE_API_TOKEN: ${LOGSERVE_API_TOKEN:?set LOGSERVE_API_TOKEN}
      LOGSERVE_RESULT_STORE: minio
      LOGSERVE_S3_ENDPOINT: http://minio:9000
      LOGSERVE_S3_BUCKET: ${LOGSERVE_S3_BUCKET:-logserve-results}
      LOGSERVE_S3_ACCESS_KEY: ${LOGSERVE_S3_ACCESS_KEY:?set LOGSERVE_S3_ACCESS_KEY}
      LOGSERVE_S3_SECRET_KEY: ${LOGSERVE_S3_SECRET_KEY:?set LOGSERVE_S3_SECRET_KEY}
      LOGSERVE_S3_REGION: ${LOGSERVE_S3_REGION:-us-east-1}
    depends_on:
      - control
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

# Named volumes make the local stack restartable without binding host paths into
# the default developer deployment.
volumes:
  postgres-data:
  minio-data:
  logstore-data:
